# /etc/apache2/sites-available/akta-partners.com.conf
#
# Site STATIQUE : pas de proxy, Apache sert les fichiers directement. C'est la différence avec
# `app.ivoire.tech`, qui est une application Node derrière un ProxyPass.
#
# Certbot ajoutera le pendant en :443 (`--apache -d akta-partners.com`) dans un fichier
# `-le-ssl.conf` séparé — ne pas le modifier à la main, il est régénéré au renouvellement.
#
# CE FICHIER REMPLACE `_headers`, qui est au format Cloudflare Pages et qu'Apache ignore
# totalement. Sans cette transposition, les polices et les images seraient rechargées à chaque
# visite et les deux en-têtes de sécurité disparaîtraient — sans que rien ne le signale.

<VirtualHost *:80>
    ServerName akta-partners.com
    DocumentRoot /var/www/akta-partners.com

    <Directory /var/www/akta-partners.com>
        Require all granted
        # Pas de .htaccess : tout est ici, en un seul endroit relisible.
        AllowOverride None
        # Pas de listage de répertoire : un dossier sans index ne doit pas exposer son contenu.
        Options -Indexes
    </Directory>

    # Certbot dépose ses fichiers de validation ici.
    <Directory /var/www/akta-partners.com/.well-known/acme-challenge>
        Require all granted
    </Directory>

    # --- Transposition de `_headers` ---
    <IfModule mod_headers.c>
        # Les polices et les images ne changent jamais sans changer de nom : un an, immuable.
        <LocationMatch "^/assets/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </LocationMatch>
        # La CSS et le JS n'ont pas d'empreinte dans leur nom : une heure, pas davantage,
        # sinon une correction mettrait une journée à atteindre les visiteurs.
        <LocationMatch "^/(css|js)/">
            Header set Cache-Control "public, max-age=3600"
        </LocationMatch>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # Apache ancien ne connaît pas toujours ces types : servis en octet-stream, le navigateur
    # refuse la police et ignore l'image.
    AddType font/woff2 .woff2
    AddType image/webp .webp
    AddType image/svg+xml .svg

    # Cloudflare comprime déjà pour les visiteurs ; ceci vaut pour qui atteint l'origine
    # directement, et ne coûte rien.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/akta-partners.com-error.log
    CustomLog ${APACHE_LOG_DIR}/akta-partners.com-access.log combined
</VirtualHost>
