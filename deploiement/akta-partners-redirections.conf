# /etc/apache2/sites-available/akta-partners-redirections.conf
#
# Trois noms, une seule adresse servie.
#
# `index.html` déclare `https://akta-partners.com/` en canonical ET en og:url. Laisser le
# `.africa` répondre le même contenu ferait deux sites identiques aux yeux des moteurs, qui
# n'en indexeraient qu'un, choisi par eux et pas par nous. Une redirection permanente dit
# lequel fait foi.
#
# 301 et non 302 : la redirection est définitive, et les moteurs ne transfèrent l'autorité
# d'un domaine à l'autre que sur un code permanent.

<VirtualHost *:80>
    ServerName www.akta-partners.com
    ServerAlias akta-partners.africa
    ServerAlias www.akta-partners.africa

    # Les validations certbot doivent aboutir AVANT la redirection, sinon les certificats de
    # ces trois noms ne peuvent jamais être émis ni renouvelés.
    <Directory /var/www/akta-partners.com/.well-known/acme-challenge>
        Require all granted
    </Directory>
    Alias /.well-known/acme-challenge /var/www/akta-partners.com/.well-known/acme-challenge
    RedirectMatch 301 "^(?!/\.well-known/acme-challenge/)(.*)$" "https://akta-partners.com$1"

    ErrorLog  ${APACHE_LOG_DIR}/akta-partners-redirections-error.log
    CustomLog ${APACHE_LOG_DIR}/akta-partners-redirections-access.log combined
</VirtualHost>
