# /etc/apache2/akta-partners.com-commun.conf
#
# Inclus par les DEUX vhosts : `akta-partners.com.conf` (:80) et le fichier `-le-ssl.conf`
# (:443) qu'a écrit certbot. C'est le second qui sert les visiteurs — Cloudflare joint
# l'origine en HTTPS — et c'est celui qu'on oublie quand on corrige à la main.
#
# Ce fichier REMPLACE `_headers`, qui est au format Cloudflare Pages et qu'Apache ignore
# totalement.

<IfModule mod_headers.c>
    # --- Le HTML ---
    #
    # Sans cette règle, la réponse ne portait AUCUN `Cache-Control`. Les navigateurs
    # appliquent alors leur heuristique (RFC 9111 §4.2.2) : ils gardent la page pour
    # environ un dixième de son âge, mesuré sur `Last-Modified`. Une page inchangée
    # depuis vingt jours était donc considérée fraîche pendant deux jours — sans même
    # demander au serveur si elle avait changé. C'est ce qui a fait que certains
    # appareils montraient encore l'ancienne version plusieurs jours après la mise en
    # ligne du 11 novembre.
    #
    # `no-cache` ne veut pas dire « ne garde rien » : le navigateur garde la page mais
    # demande au serveur si elle a bougé. Avec l'ETag, la réponse est un 304 vide quand
    # rien n'a changé — on ne paie donc que l'aller-retour, pas les 7 Ko.
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    # Les polices et les images ne changent jamais sans changer de nom : un an, immuable.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # La CSS et le JS n'ont pas d'empreinte dans leur nom : une heure, pas davantage,
    # sinon une correction mettrait une journée à atteindre les visiteurs.
    #
    # Attention : Cloudflare écrase cette heure par sa propre valeur par défaut de quatre
    # heures (`max-age=14400`), vérifiable sur la réponse publique. Pour que cet en-tête
    # fasse foi : Caching → Configuration → Browser Cache TTL → « Respect Existing Headers ».
    <LocationMatch "^/(css|js)/">
        Header set Cache-Control "public, max-age=3600"
    </LocationMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# Apache ancien ne connaît pas toujours ces types : servis en octet-stream, le navigateur
# refuse la police et ignore l'image.
AddType font/woff2 .woff2
AddType image/webp .webp
AddType image/svg+xml .svg

# Cloudflare comprime déjà pour les visiteurs ; ceci vaut pour qui atteint l'origine
# directement, et ne coûte rien.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml
</IfModule>
